title: "RED ONE MX: Repair & Maintenance Reference"
description: "Community reference for repairing, maintaining, and continuing to use RED ONE MX digital cinema cameras."
baseurl: "/r1mx"
url: "https://simukka.github.io"
author: "r1mx contributors"
repository: "simukka/r1mx"

# No gem-based theme; fully custom layout
theme: null

# Collections / defaults
collections:
  journal:
    output: true
    permalink: /journal/:slug/

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "journal"
    values:
      layout: "journal-entry"

# Navigation
nav:
  - title: "Overview"
    url: "/"
  - title: "Guides"
    url: "/guides"
  - title: "Roadmap"
    url: "/roadmap"
  - title: "Made on R1"
    url: "/made-on-r1"
  - title: "RE Journal"
    url: "/journal"

# Markdown / syntax
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-seo-tag
